<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renk Çarkı — Tablo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(135deg,#1e3c72,#2a5298,#6a3093);
    background-size:400% 400%; animation: bg 15s ease infinite;
    padding: 30px 15px; color:#fff;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .kart {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px; padding: 28px 22px;
    max-width: 620px; width: 100%; margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }
  .adminBtn {
    position: absolute; top: 14px; right: 14px;
    background: #000; color: #fff;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 11px; font-weight: bold;
    cursor: pointer; letter-spacing: 1.5px;
    transition: background .2s, transform .2s;
  }
  .adminBtn:hover { background: #333; transform: scale(1.05); }
  h1 { font-size: 22px; text-align: center; margin-bottom: 6px; }
  .alt { font-size: 13px; text-align: center; opacity: 0.75; margin-bottom: 20px; }
  .ustBar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .kucukBtn {
    background: rgba(255,255,255,0.15); color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50px; padding: 9px 20px;
    font-size: 13px; font-weight: bold; cursor: pointer;
    transition: background .2s, transform .2s;
  }
  .kucukBtn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
  .durum { font-size: 12px; opacity: 0.7; }
  #liste { display: flex; flex-direction: column; gap: 10px; }
  .satir {
    background: rgba(255,255,255,0.1);
    border-radius: 14px; padding: 14px 16px;
    display: grid; grid-template-columns: 40px 1fr auto;
    align-items: center; gap: 12px;
    border-left: 5px solid #ffd700;
    animation: satirGir .4s ease;
  }
  .satir.yeni { border-left-color: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.4); }
  @keyframes satirGir { 0%{transform:translateX(-30px);opacity:0} 100%{transform:translateX(0);opacity:1} }
  .sira { font-size: 20px; font-weight: bold; text-align: center; color: #ffd700; }
  .sira.ilk { font-size: 26px; }
  .orta { min-width: 0; }
  .isimYazi { font-size: 16px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detay { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .yildizlar { font-size: 20px; letter-spacing: 2px; text-align: right; color: #ffc107; white-space: nowrap; }
  .bos { color: #555; }
  .zaman { font-size: 11px; opacity: 0.55; text-align: right; margin-top: 4px; }
  .bosEkran { text-align: center; padding: 40px 20px; opacity: 0.7; font-size: 15px; }
  .bosEkran .emoji { font-size: 50px; display: block; margin-bottom: 12px; }
  .kayitSayisi { text-align: center; font-size: 13px; opacity: 0.75; margin-top: 18px; }
  .kayitSayisi b { color: #ffd700; }

  /* ============== ADMIN PANEL ============== */
  .modalArka {
    position: fixed; inset: 0; background: #000;
    z-index: 200;
    display: flex; justify-content: center; align-items: flex-start;
    overflow-y: auto;
    animation: karart .25s;
  }
  @keyframes karart { from{opacity:0} to{opacity:1} }
  .modalKart {
    background: #0a0a0a; color: #fff;
    border: 1px solid #1a1a1a;
    width: 100%; max-width: 700px;
    min-height: 100vh;
    padding: 20px 16px;
    position: relative;
    font-family: 'Courier New', monospace;
  }
  .modalKapat {
    position: absolute; top: 16px; right: 16px;
    background: #1a1a1a; border: 1px solid #333;
    color: #fff; width: 34px; height: 34px; border-radius: 50%;
    font-size: 16px; cursor: pointer;
    z-index: 10;
  }
  .modalKapat:hover { background: #333; }

  .sifreWrap { max-width: 340px; margin: 80px auto; text-align: center; }
  .sifreWrap h2 { font-size: 20px; margin-bottom: 24px; color: #00e676; letter-spacing: 2px; }
  .sifreInput {
    width: 100%; padding: 14px 18px;
    border-radius: 10px; border: 2px solid #00e676;
    background: #000; color: #00e676;
    font-size: 16px; text-align: center;
    outline: none; font-family: 'Courier New', monospace;
    letter-spacing: 3px;
  }
  .sifreInput:focus { box-shadow: 0 0 20px rgba(0,230,118,0.4); }
  .girisBtn {
    width: 100%; padding: 14px; border-radius: 10px;
    background: #00e676; border: none;
    color: #000; font-weight: bold; font-size: 15px;
    cursor: pointer; margin-top: 12px;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
  }
  .girisBtn:hover { background: #00c853; }
  .hataYazi { color: #f44336; margin-top: 10px; font-size: 13px; }

  .panelBaslik {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0 16px; border-bottom: 1px solid #1a1a1a;
    margin-bottom: 16px;
  }
  .panelBaslik h2 {
    color: #00e676; font-size: 16px;
    letter-spacing: 2px;
  }
  .panelBaslik .sayac {
    margin-left: auto; font-size: 12px; opacity: 0.6;
  }

  .tabs {
    display: flex; gap: 4px;
    border-bottom: 1px solid #1a1a1a;
    margin-bottom: 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabBtn {
    background: transparent; border: none;
    color: #666; font-family: 'Courier New', monospace;
    font-size: 12px; font-weight: bold;
    padding: 10px 14px; cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .tabBtn.aktif { color: #00e676; border-bottom-color: #00e676; }
  .tabBtn:hover { color: #fff; }

  .telKart {
    background: #111; border: 1px solid #1a1a1a;
    border-radius: 10px; padding: 12px 14px;
    margin-bottom: 10px;
    border-left: 4px solid #333;
  }
  .telKart.online { border-left-color: #00e676; }
  .telKart.banli { border-left-color: #f44336; opacity: 0.5; }

  .telUst {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .telIsim {
    font-weight: bold; color: #fff;
    font-size: 14px;
  }
  .telId {
    font-size: 10px; color: #666;
    font-family: monospace;
  }
  .telDurum {
    margin-left: auto;
    font-size: 10px; font-weight: bold;
    padding: 3px 10px; border-radius: 10px;
    letter-spacing: 1px;
  }
  .telDurum.online { background: #00e676; color: #000; }
  .telDurum.offline { background: #333; color: #888; }
  .telDurum.banli { background: #f44336; color: #fff; }

  .telBilgiSatir {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-size: 11px; color: #888;
    margin: 6px 0;
  }
  .telBilgiSatir span { background: #1a1a1a; padding: 3px 8px; border-radius: 4px; }

  .telButonlar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .mBtn {
    background: #1a1a1a; color: #aaa;
    border: 1px solid #333;
    border-radius: 6px; padding: 6px 12px;
    font-size: 10px; font-weight: bold;
    cursor: pointer; font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
  }
  .mBtn:hover { background: #2a2a2a; color: #fff; }
  .mBtn.ban { color: #ff6b6b; border-color: #5a1a1a; }
  .mBtn.ban:hover { background: #3a1a1a; }
  .mBtn.unban { color: #00e676; border-color: #1a5a1a; }
  .mBtn.unban:hover { background: #1a3a1a; }
  .mBtn.incele { color: #4fc3f7; border-color: #1a3a5a; }
  .mBtn.incele:hover { background: #1a2a3a; }

  .bilgiKart {
    background: #111; border: 1px solid #1a1a1a;
    border-radius: 10px; padding: 16px;
  }
  .bilgiBaslik {
    font-size: 14px; color: #00e676;
    font-weight: bold; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid #1a1a1a;
  }
  .bilgiSatir {
    display: flex; justify-content: space-between;
    padding: 8px 0; font-size: 12px;
    border-bottom: 1px solid #151515;
  }
  .bilgiSatir:last-child { border-bottom: none; }
  .bilgiSatir .anahtar { color: #666; }
  .bilgiSatir .deger { color: #fff; font-family: monospace; text-align: right; word-break: break-all; max-width: 60%; }

  .bosListe { text-align: center; padding: 40px 20px; color: #333; font-size: 12px; }
  .bosListe .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

  .yenileBtn {
    width: 100%; margin-top: 16px;
    background: #00e676; color: #000;
    border: none; padding: 12px;
    border-radius: 10px; font-weight: bold;
    cursor: pointer; font-family: 'Courier New', monospace;
    letter-spacing: 2px;
  }
  .yenileBtn:hover { background: #00c853; }

  .sonGuncelleme {
    font-size: 10px; color: #333;
    text-align: center; margin-top: 12px;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="kart">
  <button class="adminBtn" onclick="adminAc()">⚙ ADMIN</button>
  <h1>📊 Renk Çarkı Tablosu</h1>
  <p class="alt">En yeni yorum en üstte! ⭐</p>
  <div class="ustBar">
    <button class="kucukBtn" onclick="yukle()">🔄 Yenile</button>
    <button class="kucukBtn" onclick="location.href='index.html'">🎡 Oyuna Dön</button>
    <span class="durum" id="durum">Yükleniyor...</span>
  </div>
  <div id="liste"><div style="text-align:center;padding:40px;opacity:.7">⏳ Yükleniyor...</div></div>
  <div class="kayitSayisi" id="kayitSayisi"></div>
</div>

<div id="adminModal" class="modalArka" style="display:none">
  <div class="modalKart">
    <button class="modalKapat" onclick="adminKapat()">✕</button>

    <div id="sifreEkran" class="sifreWrap">
      <h2>🔐 ADMIN GİRİŞİ</h2>
      <input type="password" class="sifreInput" id="sifreInput" placeholder="••••••" autocomplete="off">
      <button class="girisBtn" onclick="sifreKontrol()">GİRİŞ</button>
      <div class="hataYazi" id="sifreHata"></div>
    </div>

    <div id="panelEkran" style="display:none">
      <div class="panelBaslik">
        <h2>👑 ADMIN PANEL</h2>
        <span class="sayac" id="sayac"></span>
      </div>

      <div class="tabs">
        <button class="tabBtn aktif" id="tabOnline" onclick="tabDegis('online')">📱 ONLINE TELEFONLAR</button>
        <button class="tabBtn" id="tabBilgi" onclick="tabDegis('bilgi')">ℹ️ BİLGİLER</button>
        <button class="tabBtn" id="tabBan" onclick="tabDegis('ban')">🚫 BAN LİSTESİ</button>
      </div>

      <div id="tabIcerik"></div>

      <button class="yenileBtn" onclick="panelYenile()">🔄 YENİLE</button>
      <div class="sonGuncelleme" id="sonGuncelleme"></div>
    </div>
  </div>
</div>

<script>
  const DB_URL = "https://renk-95728-default-rtdb.firebaseio.com";
  const ADMIN_SIFRE = "utkan9292";

  let aktifTab = 'online';
  let seciliCihazId = null;
  let tumCihazlar = [];
  let tumBanlar = { devices: {}, ips: {} };

  const yildizEmoji = { 1: '😭', 2: '🥹', 3: '😀', 4: '😃', 5: '🤩' };
  function zamanFormatla(iso) {
    const t = new Date(iso);
    const fark = Math.floor((new Date() - t) / 1000);
    if (fark < 60) return 'az önce';
    if (fark < 3600) return Math.floor(fark / 60) + ' dk önce';
    if (fark < 86400) return Math.floor(fark / 3600) + ' sa önce';
    return Math.floor(fark / 86400) + ' gün önce';
  }

  async function yukle() {
    document.getElementById('durum').textContent = 'Yükleniyor...';
    try {
      const res = await fetch(`${DB_URL}/kayitlar.json`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const liste = data ? Object.values(data) : [];
      liste.sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
      const kap = document.getElementById('liste');
      kap.innerHTML = '';
      if (liste.length === 0) {
        kap.innerHTML = '<div class="bosEkran"><span class="emoji">🌟</span>Henüz kimse yıldız vermedi!<br>İlk sen ol!</div>';
      } else {
        liste.forEach((k, idx) => {
          const y = Math.max(1, Math.min(5, k.yildiz || 0));
          let yildizHTML = '';
          for (let i = 1; i <= 5; i++) yildizHTML += i <= y ? '<span>★</span>' : '<span class="bos">★</span>';
          const satir = document.createElement('div');
          satir.className = 'satir' + (idx === 0 ? ' yeni' : '');
          satir.innerHTML = `
            <div class="sira ${idx === 0 ? 'ilk' : ''}">${idx === 0 ? '👑' : (idx + 1)}</div>
            <div class="orta">
              <div class="isimYazi">${k.isim}</div>
              <div class="detay">${yildizEmoji[y] || ''} ${k.deneme} denemede eşitlendi</div>
            </div>
            <div>
              <div class="yildizlar">${yildizHTML}</div>
              <div class="zaman">${zamanFormatla(k.tarih)}</div>
            </div>`;
          kap.appendChild(satir);
        });
      }
      document.getElementById('kayitSayisi').innerHTML =
        `Toplam <b>${liste.length}</b> kayıt • ${new Date().toLocaleTimeString('tr-TR')}`;
      document.getElementById('durum').textContent = '✅ Güncel';
    } catch (err) {
      document.getElementById('durum').textContent = '❌ Hata';
      document.getElementById('liste').innerHTML = '<div class="bosEkran"><span class="emoji">😢</span>Veriler yüklenemedi.</div>';
    }
  }
  yukle();

  function adminAc() {
    document.getElementById('adminModal').style.display = 'flex';
    document.getElementById('sifreEkran').style.display = 'block';
    document.getElementById('panelEkran').style.display = 'none';
    document.getElementById('sifreInput').value = '';
    document.getElementById('sifreHata').textContent = '';
    setTimeout(() => document.getElementById('sifreInput').focus(), 200);
  }
  function adminKapat() {
    document.getElementById('adminModal').style.display = 'none';
  }
  function sifreKontrol() {
    if (document.getElementById('sifreInput').value === ADMIN_SIFRE) {
      document.getElementById('sifreEkran').style.display = 'none';
      document.getElementById('panelEkran').style.display = 'block';
      panelYenile();
    } else {
      document.getElementById('sifreHata').textContent = '❌ Yanlış şifre!';
    }
  }
  document.getElementById('sifreInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sifreKontrol();
  });

  function tabDegis(tab) {
    aktifTab = tab;
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.remove('aktif'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('aktif');
    panelCiz();
  }

  async function panelYenile() {
    try {
      const [presRes, bdRes, biRes] = await Promise.all([
        fetch(`${DB_URL}/presence.json`),
        fetch(`${DB_URL}/bans/devices.json`),
        fetch(`${DB_URL}/bans/ips.json`)
      ]);
      const pres = (await presRes.json()) || {};
      tumBanlar.devices = (await bdRes.json()) || {};
      tumBanlar.ips = (await biRes.json()) || {};

      const simdi = Date.now();
      tumCihazlar = Object.values(pres).map(p => ({
        ...p,
        isOnline: (simdi - new Date(p.lastSeen).getTime()) < 180000,
        banli: !!tumBanlar.devices[p.deviceId]
      })).sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));

      tumCihazlar.forEach((c, i) => c.isim = 'Telefon ' + (i + 1));

      const onlineSayi = tumCihazlar.filter(x => x.isOnline && !x.banli).length;
      document.getElementById('sayac').textContent =
        '🟢 ' + onlineSayi + ' online / ' + tumCihazlar.length + ' toplam';

      panelCiz();
      document.getElementById('sonGuncelleme').textContent =
        'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR');
    } catch(e) {
      console.error(e);
      document.getElementById('tabIcerik').innerHTML =
        '<div class="bosListe"><span class="emoji">😢</span>Veri alınamadı</div>';
    }
  }

  function panelCiz() {
    const ic = document.getElementById('tabIcerik');
    if (aktifTab === 'online') ic.innerHTML = onlineHtml();
    else if (aktifTab === 'bilgi') ic.innerHTML = bilgiHtml();
    else if (aktifTab === 'ban') ic.innerHTML = banHtml();
  }

  function onlineHtml() {
    if (tumCihazlar.length === 0) {
      return '<div class="bosListe"><span class="emoji">📭</span>Henüz kimse girmemiş</div>';
    }
    return tumCihazlar.map(c => {
      const sn = Math.floor((Date.now() - new Date(c.lastSeen).getTime()) / 1000);
      const sonGor = sn < 60 ? sn + ' sn önce' : sn < 3600 ? Math.floor(sn/60) + ' dk önce' : Math.floor(sn/3600) + ' sa önce';
      const durum = c.banli ? 'banli' : (c.isOnline ? 'online' : 'offline');
      const durumYazi = c.banli ? 'BANLI' : (c.isOnline ? '● ONLINE' : '○ OFFLINE');
      const b = c.bilgi || {};
      const ipKey = (c.ip || '').replace(/\./g, '_');
      return `
        <div class="telKart ${durum}">
          <div class="telUst">
            <span class="telIsim">${c.isim}</span>
            <span class="telId">${(c.deviceId || '').substring(0, 12)}...</span>
            <span class="telDurum ${durum}">${durumYazi}</span>
          </div>
          <div class="telBilgiSatir">
            <span>📱 ${b.marka || '?'}</span>
            <span>🌐 ${c.ip || '?'}</span>
            <span>🕐 ${sonGor}</span>
          </div>
          <div class="telButonlar">
            <button class="mBtn incele" onclick="cihazIncele('${c.deviceId}')">ℹ️ İNCELE</button>
            ${!c.banli
              ? `<button class="mBtn ban" onclick="cihazBan('${c.deviceId}')">🚫 CİHAZ BAN</button>`
              : `<button class="mBtn unban" onclick="cihazUnban('${c.deviceId}')">✅ BAN KALDIR</button>`
            }
            ${c.ip && c.ip !== 'bilinmiyor' && !tumBanlar.ips[ipKey]
              ? `<button class="mBtn ban" onclick="ipBan('${c.ip}')">🌐 IP BAN</button>`
              : (tumBanlar.ips[ipKey] ? `<button class="mBtn unban" onclick="ipUnban('${ipKey}')">✅ IP KALDIR</button>` : '')
            }
          </div>
        </div>`;
    }).join('');
  }

  function bilgiHtml() {
    if (!seciliCihazId) {
      return '<div class="bosListe"><span class="emoji">ℹ️</span>Bir cihaz seçmek için<br>"Online Telefonlar" sekmesinde<br>ℹ️ İNCELE butonuna bas</div>';
    }
    const c = tumCihazlar.find(x => x.deviceId === seciliCihazId);
    if (!c) return '<div class="bosListe">Cihaz bulunamadı</div>';
    const b = c.bilgi || {};
    const sn = Math.floor((Date.now() - new Date(c.lastSeen).getTime()) / 1000);
    const sonGor = sn < 60 ? sn + ' sn önce' : sn < 3600 ? Math.floor(sn/60) + ' dk önce' : Math.floor(sn/3600) + ' sa önce';
    const ilkGor = new Date(c.firstSeen).toLocaleString('tr-TR');

    const satirlar = [
      ['🆔 Cihaz ID', c.deviceId],
      ['📛 İsim', c.isim],
      ['📍 IP Adresi', c.ip || '?'],
      ['📱 Marka', b.marka || '?'],
      ['💻 İşletim Sistemi', b.os || '?'],
      ['🌐 Tarayıcı', b.tarayici || '?'],
      ['📐 Ekran', b.ekran || '?'],
      ['🪟 Pencere', b.pencere || '?'],
      ['🗣️ Dil', b.dil || '?'],
      ['🕐 Saat Dilimi', b.saatDilimi || '?'],
      ['📲 Mobil mi?', b.mobil ? 'Evet' : 'Hayır'],
      ['🧠 İşlemci Çekirdek', b.cekirdek || '?'],
      ['💾 Bellek (GB)', b.bellek || '?'],
      ['📡 Bağlantı', b.baglanti || '?'],
      ['👆 Dokunmatik', b.dokunmatik ? 'Evet' : 'Hayır'],
      ['🕐 İlk Görülme', ilkGor],
      ['🕐 Son Görülme', sonGor]
    ];

    return `<div class="bilgiKart">
      <div class="bilgiBaslik">📋 ${c.isim} — Cihaz Bilgileri</div>
      ${satirlar.map(s => '<div class="bilgiSatir"><span class="anahtar">' + s[0] + '</span><span class="deger">' + s[1] + '</span></div>').join('')}
    </div>`;
  }

  function banHtml() {
    const bd = Object.entries(tumBanlar.devices || {});
    const bi = Object.entries(tumBanlar.ips || {});
    if (bd.length === 0 && bi.length === 0) {
      return '<div class="bosListe"><span class="emoji">✨</span>Henüz banlanan yok</div>';
    }
    let html = '';
    if (bd.length > 0) {
      html += '<div style="font-size:12px;color:#f44336;margin:12px 0 8px;letter-spacing:1px;">🚫 BANLI CİHAZLAR ('
