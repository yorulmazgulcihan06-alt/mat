<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renk Çarkı — Oyun</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  :root {
    --bg1:#1e3c72; --bg2:#2a5298; --bg3:#6a3093;
    --kart-bg: rgba(255,255,255,0.08);
    --kart-border: rgba(255,255,255,0.18);
    --yazi: #fff;
    --puan-bg: rgba(255,255,255,0.1);
    --input-bg: rgba(255,255,255,0.1);
  }
  body.aydinlik {
    --bg1:#e3f2fd; --bg2:#bbdefb; --bg3:#f8bbd0;
    --kart-bg: rgba(255,255,255,0.85);
    --kart-border: rgba(0,0,0,0.1);
    --yazi: #1a1a2e;
    --puan-bg: rgba(0,0,0,0.05);
    --input-bg: rgba(0,0,0,0.05);
  }
  body {
    min-height:100vh;
    background: linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%; animation: bg 15s ease infinite;
    display:flex; justify-content:center; align-items:center;
    padding:20px; color: var(--yazi);
    transition: color 0.3s;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .kart {
    background: var(--kart-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--kart-border);
    border-radius: 24px; padding: 28px 24px;
    max-width: 520px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
    transition: background 0.3s, border 0.3s;
  }
  .temaBtn {
    position: absolute; top: 14px; right: 14px;
    background: rgba(0,0,0,0.3); color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%; width: 40px; height: 40px;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  body.aydinlik .temaBtn { background: rgba(0,0,0,0.1); color: #333; border-color: rgba(0,0,0,0.2); }
  h1 { font-size: 21px; margin-bottom: 6px; }
  .alt { font-size: 13px; opacity: 0.75; margin-bottom: 18px; }
  .cark-alani { position: relative; width: 300px; height: 300px; max-width: 100%; margin: 0 auto 18px; }
  canvas { width: 100%; height: auto; display:block; }
  .ibre {
    position:absolute; top:-12px; left:50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 38px solid #ffd700; z-index: 5;
  }
  .merkez {
    position:absolute; top:50%; left:50%;
    width:36px; height:36px; background:#fff; border-radius:50%;
    transform: translate(-50%,-50%); z-index: 4;
  }
  .simsek {
    position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95), transparent 70%);
    opacity:0; pointer-events:none; z-index: 6;
  }
  .simsek.aktif { animation: simsekAnim 0.25s ease-out; }
  @keyframes simsekAnim {
    0% { opacity:0; transform: scale(0.7); }
    40% { opacity:1; transform: scale(1.15); }
    100% { opacity:0; transform: scale(1.4); }
  }
  .butonlar { display:flex; gap: 10px; justify-content:center; flex-wrap: wrap; margin-bottom: 6px; }
  button.anaBtn {
    background: linear-gradient(135deg,#ff512f,#dd2476);
    color:#fff; border:none; border-radius:50px;
    padding: 14px 32px; font-size: 16px; font-weight: bold;
    cursor: pointer; box-shadow: 0 8px 20px rgba(221,36,118,0.5);
  }
  button.otomatikBtn { background: linear-gradient(135deg,#00c853,#00bfa5); }
  button.anaBtn:disabled { opacity:.45; cursor:not-allowed; }
  .puanlar { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0 12px; }
  .puan {
    background: var(--puan-bg); border-radius: 14px; padding: 12px 14px;
    display:flex; align-items:center; gap:10px; border-left: 5px solid;
    transition: background 0.3s;
  }
  .puan.vurgu { transform: scale(1.08); }
  .renk-nokta { width:16px; height:16px; border-radius:50%; }
  .puan .isim { font-size: 13px; }
  .puan .sayi { margin-left:auto; font-size: 22px; font-weight: bold; }
  .istatistik { margin-top: 10px; font-size: 14px; }
  .istatistik b { color: #ffd700; font-size: 18px; }
  body.aydinlik .istatistik b { color: #d4a017; }
  .hiz { font-size: 12px; opacity: 0.7; margin-top: 10px; }
  .gizli { display:none !important; }
  .sonucPanel {
    margin-top: 18px; padding: 22px 18px;
    background: linear-gradient(135deg, rgba(76,175,80,0.28), rgba(33,150,243,0.28));
    border: 2px solid rgba(255,215,0,0.6); border-radius: 18px;
  }
  .sonucPanel h2 { font-size: 20px; margin-bottom: 6px; }
  .denemeBuyuk { font-size: 44px; font-weight: bold; color:#ffd700; display:block; margin: 6px 0 14px; }
  body.aydinlik .denemeBuyuk { color: #d4a017; }
  .yildizSecici { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
  .yildizSecici span { font-size: 48px; cursor: pointer; color: #555; user-select: none; line-height: 1; }
  .yildizSecici span.dolu { color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8); }
  .yildizEtiket { font-size: 14px; margin-bottom: 8px; }
  .yildizEtiket b { color: #ffd700; }
  body.aydinlik .yildizEtiket b { color: #d4a017; }
  .isimInput {
    width: 100%; max-width: 280px;
    padding: 12px 18px; border-radius: 50px;
    border: 2px solid var(--kart-border);
    background: var(--input-bg);
    color: var(--yazi); font-size: 15px;
    text-align: center; margin: 12px auto 0; display: block;
    outline: none;
  }
  .isimInput::placeholder { color: rgba(128,128,128,0.7); }
  .yorumInput {
    width: 100%; max-width: 280px;
    padding: 12px 18px; border-radius: 20px;
    border: 2px solid var(--kart-border);
    background: var(--input-bg);
    color: var(--yazi); font-size: 14px;
    margin: 12px auto 0; display: block;
    outline: none; resize: none; height: 60px;
    font-family: inherit;
  }
  .yorumInput::placeholder { color: rgba(128,128,128,0.7); }
  .gonderBtn {
    background: linear-gradient(135deg,#ffd700,#ff8c00);
    color: #333; border: none; border-radius: 50px;
    padding: 14px 40px; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 14px;
  }
  .gonderBtn:disabled { opacity: .5; cursor: not-allowed; }
  .tabloLink { display: inline-block; margin-top: 14px; color: var(--yazi); font-size: 13px; text-decoration: underline; opacity: 0.85; }
  .bildirim { margin-top: 12px; font-size: 14px; padding: 10px; border-radius: 12px; }
  .bildirim.iyi { background: rgba(76,175,80,0.5); color:#fff; }
  .bildirim.kotu { background: rgba(244,67,54,0.5); color:#fff; }

  .qrWrap { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--kart-border); display:none; }
  .qrWrap.aktif { display:block; }
  .qrBaslik { font-size: 13px; opacity: 0.75; margin-bottom: 10px; }
  .qrWrap img { width: 180px; height: 180px; background:#fff; padding:12px; border-radius:14px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
  .qrLink { font-size: 11px; opacity: 0.6; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>

<div class="kart">
  <button class="temaBtn" onclick="temaDegistir()" id="temaBtn" title="Tema degistir">🌙</button>
  <h1>Renk Carki Oyunu</h1>
  <p class="alt">Oyna, sonra kendi yildizini ver!</p>

  <div class="cark-alani">
    <div class="ibre"></div>
    <canvas id="cark" width="320" height="320"></canvas>
    <div class="merkez"></div>
    <div class="simsek" id="simsek"></div>
  </div>

  <div class="butonlar">
    <button class="anaBtn" id="cevirBtn" onclick="tekCevir()">TEK CEVIR</button>
    <button class="anaBtn otomatikBtn" id="otoBtn" onclick="otomatikCevir()">OTOMATIK CEVIR</button>
  </div>

  <div class="hiz" id="hizYazi">Hazir</div>

  <div class="puanlar">
    <div class="puan" id="p0" style="border-color:#2196F3;">
      <div class="renk-nokta" style="background:#2196F3;"></div>
      <span class="isim">Mavi</span><span class="sayi" id="s0">0</span>
    </div>
    <div class="puan" id="p1" style="border-color:#4CAF50;">
      <div class="renk-nokta" style="background:#4CAF50;"></div>
      <span class="isim">Yesil</span><span class="sayi" id="s1">0</span>
    </div>
    <div class="puan" id="p2" style="border-color:#F44336;">
      <div class="renk-nokta" style="background:#F44336;"></div>
      <span class="isim">Kirmizi</span><span class="sayi" id="s2">0</span>
    </div>
    <div class="puan" id="p3" style="border-color:#888;">
      <div class="renk-nokta" style="background:#222; border:1px solid #999;"></div>
      <span class="isim">Siyah</span><span class="sayi" id="s3">0</span>
    </div>
  </div>

  <div class="istatistik">Toplam deneme: <b id="deneme">0</b></div>

  <div class="sonucPanel gizli" id="sonucPanel">
    <h2>Tum Puanlar Esitlendi!</h2>
    <span class="denemeBuyuk" id="sonucDeneme">0</span>
    <div class="yildizEtiket">Simdi kendi yildizini sec:</div>
    <div class="yildizSecici" id="yildizSecici">
      <span data-y="1">*</span>
      <span data-y="2">*</span>
      <span data-y="3">*</span>
      <span data-y="4">*</span>
      <span data-y="5">*</span>
    </div>
    <div class="yildizEtiket" id="yildizYazi">Yildiz secilmedi</div>
    <textarea class="yorumInput" id="yorumInput" placeholder="Yorum yaz (istege bagli)" maxlength="100"></textarea>
    <input type="text" class="isimInput" id="isimInput" placeholder="Adin ne?" maxlength="15">
    <button class="gonderBtn" id="gonderBtn" onclick="gonder()" disabled>GONDER</button>
    <div class="bildirim gizli" id="bildirim"></div>
    <a href="tablo.html" class="tabloLink">Tabloyu Gor</a>
  </div>

  <div class="qrWrap" id="qrWrap">
    <div class="qrBaslik">📱 Bu sayfayı arkadaşlarına gönder</div>
    <img id="qrImg" src="" alt="QR Kod">
    <div class="qrLink" id="qrLink"></div>
  </div>
</div>

<script>
  var DB_URL = "https://renk-95728-default-rtdb.firebaseio.com";
  var RENKLER = ["#2196F3", "#4CAF50", "#F44336", "#222222"];
  var ISIMLER = ["Mavi", "Yesil", "Kirmizi", "Siyah"];
  var puanlar = [0, 0, 0, 0];
  var denemeSayisi = 0, rotation = 0, bitti = false, secilenYildiz = 0;

  var canvas = document.getElementById("cark");
  var ctx = canvas.getContext("2d");
  var MERKEZ = 160, YARICAP = 150;

  // ============ TEMA ============
  function temaDegistir() {
    document.body.classList.toggle("aydinlik");
    var aydinlik = document.body.classList.contains("aydinlik");
    document.getElementById("temaBtn").textContent = aydinlik ? "☀️" : "🌙";
    localStorage.setItem("cark_tema", aydinlik ? "aydinlik" : "karanlik");
    sesCal("tik");
  }
  if (localStorage.getItem("cark_tema") === "aydinlik") {
    document.body.classList.add("aydinlik");
    document.getElementById("temaBtn").textContent = "☀️";
  }

  // ============ SES ============
  var audioCtx = null;
  function sesCal(tip) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (tip === "tik") {
        osc.frequency.value = 800; osc.type = "square";
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      } else if (tip === "ding") {
        osc.frequency.value = 1200; osc.type = "sine";
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
      } else if (tip === "yildiz") {
        osc.frequency.value = 600; osc.type = "triangle";
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.frequency.linearRampToValueAtTime(1500, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch(e) {}
  }

  // ============ KONFETI (Dinamik olusturuluyor) ============
  var konfetiCanvas = document.createElement("canvas");
  konfetiCanvas.id = "konfeti";
  konfetiCanvas.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
  document.body.appendChild(konfetiCanvas);
  var kCtx = konfetiCanvas.getContext("2d");
  var konfetiler = [];
  var konfetiAktif = false;

  function boyutAyarla() {
    konfetiCanvas.width = window.innerWidth;
    konfetiCanvas.height = window.innerHeight;
  }
  boyutAyarla();
  window.addEventListener("resize", boyutAyarla);

  function konfetiBaslat() {
    konfetiler = [];
    var renkler = ["#ffd700", "#ff512f", "#dd2476", "#00c853", "#2196F3", "#9c27b0"];
    for (var i = 0; i < 150; i++) {
      konfetiler.push({
        x: Math.random() * konfetiCanvas.width,
        y: -20 - Math.random() * 300,
        boyut: 6 + Math.random() * 8,
        hizY: 2 + Math.random() * 4,
        hizX: -1 + Math.random() * 2,
        renk: renkler[Math.floor(Math.random() * renkler.length)],
        donus: Math.random() * Math.PI * 2,
        donusHizi: -0.1 + Math.random() * 0.2
      });
    }
    if (!konfetiAktif) { konfetiAktif = true; konfetiDongu(); }
  }
  function konfetiDongu() {
    kCtx.clearRect(0, 0, konfetiCanvas.width, konfetiCanvas.height);
    var hepsiGecti = true;
    for (var i = 0; i < konfetiler.length; i++) {
      var k = konfetiler[i];
      k.y += k.hizY; k.x += k.hizX; k.donus += k.donusHizi;
      if (k.y < konfetiCanvas.height + 50) hepsiGecti = false;
      kCtx.save(); kCtx.translate(k.x, k.y); kCtx.rotate(k.donus);
      kCtx.fillStyle = k.renk;
      kCtx.fillRect(-k.boyut/2, -k.boyut/4, k.boyut, k.boyut/2);
      kCtx.restore();
    }
    if (!hepsiGecti) {
      requestAnimationFrame(konfetiDongu);
    } else {
      konfetiAktif = false;
      kCtx.clearRect(0, 0, konfetiCanvas.width, konfetiCanvas.height);
    }
  }

  // ============ CARK ============
  function carkCiz() {
    for (var i = 0; i < 4; i++) {
      var bas = i * Math.PI / 2, bit = (i + 1) * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(MERKEZ, MERKEZ);
      ctx.arc(MERKEZ, MERKEZ, YARICAP, bas, bit); ctx.closePath();
      ctx.fillStyle = RENKLER[i]; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 3; ctx.stroke();
      var oa = bas + Math.PI / 4;
      var tx = MERKEZ + Math.cos(oa) * YARICAP * 0.62;
      var ty = MERKEZ + Math.sin(oa) * YARICAP * 0.62;
      ctx.save(); ctx.translate(tx, ty);
      ctx.fillStyle = "#fff"; ctx.font = "bold 16px Segoe UI, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(ISIMLER[i], 0, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(MERKEZ, MERKEZ, YARICAP, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 7; ctx.stroke();
  }
  function carkDondur(a) {
    ctx.clearRect(0, 0, 320, 320);
    ctx.save(); ctx.translate(MERKEZ, MERKEZ); ctx.rotate(a * Math.PI / 180); ctx.translate(-MERKEZ, -MERKEZ);
    carkCiz(); ctx.restore();
  }
  function carkaDilimGoster(d) {
    var ha = d * 90 + 45;
    var ir = ((270 - ha) % 360 + 360) % 360;
    var mr = ((rotation % 360) + 360) % 360;
    var f = ((ir - mr) % 360 + 360) % 360;
    rotation += 360 + f; carkDondur(rotation);
  }
  function simsekCak() {
    var s = document.getElementById("simsek");
    s.classList.remove("aktif"); void s.offsetWidth; s.classList.add("aktif");
  }
  function vurgula(i) {
    var el = document.getElementById("p" + i);
    el.classList.add("vurgu"); setTimeout(function() { el.classList.remove("vurgu"); }, 700);
  }
  function guncelle() {
    for (var i = 0; i < 4; i++) document.getElementById("s" + i).textContent = puanlar[i];
    document.getElementById("deneme").textContent = denemeSayisi;
  }
  function hepsiEsitMi() {
    return puanlar[0] === puanlar[1] && puanlar[1] === puanlar[2] && puanlar[2] === puanlar[3];
  }

  function tekCevir() {
    if (bitti) return;
    simsekCak(); sesCal("tik");
    var h = Math.floor(Math.random() * 4);
    puanlar[h]++; denemeSayisi++;
    guncelle(); carkaDilimGoster(h); vurgula(h);
    if (hepsiEsitMi()) bitir();
  }

  function otomatikCevir() {
    if (bitti) return;
    document.getElementById("cevirBtn").disabled = true;
    document.getElementById("otoBtn").disabled = true;
    document.getElementById("hizYazi").textContent = "Hesaplaniyor...";

    var guv = 0;
    while (true) {
      guv++;
      var sec;
      if (Math.random() < 0.80) {
        sec = Math.floor(Math.random() * 4);
      } else {
        var ek = Math.min(puanlar[0], puanlar[1], puanlar[2], puanlar[3]);
        var adaylar = [];
        for (var i = 0; i < 4; i++) if (puanlar[i] === ek) adaylar.push(i);
        sec = adaylar[Math.floor(Math.random() * adaylar.length)];
      }
      puanlar[sec]++; denemeSayisi++;
      if (hepsiEsitMi()) break;
      if (guv > 5000000) break;
    }

    simsekCak(); guncelle(); sesCal("ding");
    var son = Math.floor(Math.random() * 4);
    carkaDilimGoster(son);
    for (var i = 0; i < 4; i++) vurgula(i);
    bitir();
  }

  function bitir() {
    bitti = true;
    document.getElementById("hizYazi").textContent = "Bitti! Simdi yildizini sec";
    document.getElementById("sonucDeneme").textContent = denemeSayisi + " deneme";
    document.getElementById("sonucPanel").classList.remove("gizli");
    document.getElementById("sonucPanel").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  var yildizYaziTablo = { 1: "Uhuhuhu...", 2: "Yanii...", 3: "Olurr!", 4: "Huhuu!", 5: "Cok tesekkurler!" };

  var spans = document.querySelectorAll("#yildizSecici span");
  for (var i = 0; i < spans.length; i++) {
    spans[i].addEventListener("click", function() {
      secilenYildiz = parseInt(this.dataset.y);
      var all = document.querySelectorAll("#yildizSecici span");
      for (var j = 0; j < all.length; j++) {
        if (j < secilenYildiz) all[j].classList.add("dolu");
        else all[j].classList.remove("dolu");
      }
      document.getElementById("yildizYazi").innerHTML = "<b>" + secilenYildiz + " yildiz</b> - " + yildizYaziTablo[secilenYildiz];
      sesCal("yildiz");
      if (secilenYildiz === 5) konfetiBaslat();
      kontrolGonder();
    });
  }

  document.getElementById("isimInput").addEventListener("input", kontrolGonder);

  function kontrolGonder() {
    var ad = document.getElementById("isimInput").value.trim();
    document.getElementById("gonderBtn").disabled = !(secilenYildiz > 0 && ad.length > 0);
  }

  async function gonder() {
    var ad = document.getElementById("isimInput").value.trim();
    if (!ad || !secilenYildiz) return;
    var btn = document.getElementById("gonderBtn");
    btn.disabled = true;
    btn.textContent = "Gonderiliyor...";
    var bildirim = document.getElementById("bildirim");
    bildirim.classList.add("gizli");
    try {
      var res = await fetch(DB_URL + "/kayitlar.json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          isim: ad,
          yildiz: secilenYildiz,
          deneme: denemeSayisi,
          yorum: document.getElementById("yorumInput").value.trim() || "",
          tarih: new Date().toISOString()
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      bildirim.className = "bildirim iyi";
      bildirim.innerHTML = "Gonderildi! Tabloya yonlendiriliyorsun...";
      bildirim.classList.remove("gizli");
      sesCal("ding");
      setTimeout(function() { window.location.href = "tablo.html"; }, 1200);
    } catch (err) {
      bildirim.className = "bildirim kotu";
      bildirim.innerHTML = "Gonderilemedi: " + err.message;
      bildirim.classList.remove("gizli");
      btn.disabled = false;
      btn.textContent = "GONDER";
    }
  }

  carkDondur(0);

  // ============ QR KOD ============
  setTimeout(function() {
    try {
      var url = window.location.href;
      document.getElementById("qrLin
