<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Renk Carki</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3c72">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#1e3c72,#2a5298,#6a3093);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#fff}
body.light{background:linear-gradient(135deg,#e3f2fd,#bbdefb,#f8bbd0);color:#333}
.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:25px;max-width:500px;width:100%;text-align:center;position:relative}
body.light .card{background:rgba(255,255,255,.85)}
.menuBtn{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.3);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;z-index:100;text-decoration:none;display:flex;align-items:center;justify-content:center}
body.light .menuBtn{background:rgba(0,0,0,.1);color:#333}
.temaBtn{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.3);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;z-index:100}
body.light .temaBtn{background:rgba(0,0,0,.1);color:#333}
h1{font-size:22px;margin-bottom:4px}
.sub{font-size:12px;opacity:.75;margin-bottom:10px}
.rozetler{display:flex;justify-content:center;gap:5px;margin:10px 0;flex-wrap:wrap}
.rozet{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:17px;opacity:.25;border:2px solid transparent}
.rozet.kazanildi{opacity:1;background:linear-gradient(135deg,gold,orange);box-shadow:0 0 12px rgba(255,215,0,.6);border-color:#fff}
.wheel-area{position:relative;width:280px;height:280px;margin:15px auto}
canvas{width:100%;height:100%}
.needle{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid gold;z-index:5}
.btn{padding:13px 28px;border:none;border-radius:50px;background:linear-gradient(135deg,#ff512f,#dd2476);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;margin:5px}
.btn-green{background:linear-gradient(135deg,#00c853,#00bfa5)}
.btn:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}
.stat{background:rgba(255,255,255,.1);padding:10px;border-radius:12px;display:flex;align-items:center;gap:8px;border-left:4px solid}
body.light .stat{background:rgba(0,0,0,.05)}
.dot{width:14px;height:14px;border-radius:50%}
.name{font-size:12px}
.num{margin-left:auto;font-size:20px;font-weight:bold}
.info{font-size:13px;margin:8px 0}
.info b{color:gold;font-size:16px}
.hidden{display:none!important}
.result{margin-top:15px;padding:15px;background:rgba(76,175,80,.3);border:2px solid gold;border-radius:15px}
.big-num{font-size:42px;font-weight:bold;color:gold;display:block;margin:5px 0}
.lbl{font-size:13px;margin:6px 0}
.star-picker{display:flex;justify-content:center;gap:5px;margin:10px 0}
.star-picker span{font-size:42px;cursor:pointer;color:#555;user-select:none;line-height:1}
.star-picker span.on{color:gold}
input,textarea{width:100%;max-width:260px;padding:11px 15px;border-radius:50px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:inherit;font-size:14px;text-align:center;margin:6px auto 0;display:block;outline:none;font-family:inherit}
body.light input,body.light textarea{border-color:rgba(0,0,0,.2);background:rgba(0,0,0,.05)}
textarea{border-radius:15px;resize:none;height:50px}
.send-btn{background:linear-gradient(135deg,gold,orange);color:#333;border:none;border-radius:50px;padding:13px 38px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:12px}
.send-btn:disabled{opacity:.5}
.msg{margin-top:10px;padding:8px;border-radius:10px;font-size:13px}
.msg-ok{background:rgba(76,175,80,.5)}
.msg-err{background:rgba(244,67,54,.5)}
.share-row{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.share-btn{border:none;border-radius:50px;padding:10px 16px;font-size:12px;font-weight:bold;cursor:pointer;color:#fff}
.share-wa{background:linear-gradient(135deg,#25d366,#128c7e)}
.share-tg{background:linear-gradient(135deg,#0088cc,#006699)}
.share-kopyala{background:linear-gradient(135deg,#6a3093,#2a5298)}
.qr-box{margin-top:20px;padding-top:15px;border-top:1px solid rgba(128,128,128,.3);display:none}
.qr-box.show{display:block}
.qr-box img{width:160px;height:160px;background:#fff;padding:10px;border-radius:12px}
.tablo-link{display:block;margin-top:12px;color:inherit;font-size:12px}
.banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#f44336,#c62828);color:#fff;padding:14px 20px;text-align:center;font-size:14px;font-weight:bold;cursor:pointer;z-index:9999;display:none}
.banner.show{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10000;display:none;justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modalBox{background:#fff;color:#333;border-radius:20px;padding:25px;max-width:400px;width:100%;text-align:center}
.modalBox h2{color:#c62828;margin-bottom:12px;font-size:20px}
.modalBox p{font-size:15px;line-height:1.5;margin-bottom:16px;white-space:pre-wrap;text-align:left}
.modalBox button{background:linear-gradient(135deg,#f44336,#c62828);color:#fff;border:none;border-radius:50px;padding:12px 35px;font-size:15px;font-weight:bold;cursor:pointer}
.rozetModal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:10001;display:none;justify-content:center;align-items:center;padding:20px}
.rozetModal.show{display:flex}
.rozetBox{background:linear-gradient(160deg,#fff,#f0f4ff);color:#333;border-radius:20px;padding:30px 25px;max-width:340px;width:100%;text-align:center}
.rozetBox .buyukEmoji{font-size:80px;display:block;margin-bottom:12px}
.rozetBox h2{color:#ff8c00;font-size:20px;margin-bottom:8px}
.rozetBox p{font-size:14px;color:#666;margin-bottom:16px}
.rozetBox button{background:linear-gradient(135deg,gold,orange);color:#333;border:none;border-radius:50px;padding:12px 35px;font-size:15px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="rozetModal" id="rozetModal"><div class="rozetBox"><span class="buyukEmoji" id="rozetEmoji">&#127942;</span><h2>YENI ROZET!</h2><p id="rozetIsim">Rozet kazandin!</p><button onclick="rozetKapat()">HARIKA!</button></div></div>
<div class="banner" id="banner" onclick="mesajAc()">&#128233; Yeni mesajin var! Okumak icin tikla</div>
<div class="modal" id="modal"><div class="modalBox"><h2>&#128233; Mesaj</h2><p id="mMetin"></p><small id="mTarih" style="display:block;font-size:11px;color:#999;margin-bottom:15px;"></small><button onclick="mesajKapat()">TAMAM</button></div></div>
<div class="card">
<a href="oyunlar.html" class="menuBtn" title="Matematik Oyunlari">&#127918;</a>
<button class="temaBtn" id="temaBtn" onclick="temaDegistir()">&#127769;</button>
<h1>Renk Carki</h1>
<p class="sub">Oyna ve yildiz ver!</p>
<div class="rozetler" id="rozetler"></div>
<div class="info" id="rekorGoster" style="color:gold;"></div>
<div class="wheel-area"><div class="needle"></div><canvas id="cark" width="300" height="300"></canvas></div>
<button class="btn" id="cevirBtn" onclick="tekCevir()">TEK CEVIR</button>
<button class="btn btn-green" id="otoBtn" onclick="otomatikCevir()">OTOMATIK</button>
<div class="info" id="hizYazi">Hazir</div>
<div class="stats">
<div class="stat" style="border-color:#2196F3"><div class="dot" style="background:#2196F3"></div><span class="name">Mavi</span><span class="num" id="s0">0</span></div>
<div class="stat" style="border-color:#4CAF50"><div class="dot" style="background:#4CAF50"></div><span class="name">Yesil</span><span class="num" id="s1">0</span></div>
<div class="stat" style="border-color:#F44336"><div class="dot" style="background:#F44336"></div><span class="name">Kirmizi</span><span class="num" id="s2">0</span></div>
<div class="stat" style="border-color:#666"><div class="dot" style="background:#222"></div><span class="name">Siyah</span><span class="num" id="s3">0</span></div>
</div>
<div class="info">Toplam: <b id="deneme">0</b></div>
<div class="result hidden" id="sonucPanel">
<h2 id="sBaslik">Tum Puanlar Esitlendi!</h2>
<span class="big-num" id="sDeneme">0</span>
<div class="lbl">Yildizini sec:</div>
<div class="star-picker" id="yildizSecici"><span data-y="1">&#9733;</span><span data-y="2">&#9733;</span><span data-y="3">&#9733;</span><span data-y="4">&#9733;</span><span data-y="5">&#9733;</span></div>
<div class="lbl" id="yildizYazi">Yildiz secilmedi</div>
<textarea id="yorumInput" placeholder="Yorum" maxlength="100"></textarea>
<input type="text" id="isimInput" placeholder="Adin ne?" maxlength="15">
<button class="send-btn" id="gonderBtn" onclick="gonder()" disabled>GONDER</button>
<div class="msg hidden" id="bildirim"></div>
<div class="share-row">
<button class="share-btn share-wa" onclick="paylasWA()">&#128172; WhatsApp</button>
<button class="share-btn share-tg" onclick="paylasTG()">&#9992; Telegram</button>
<button class="share-btn share-kopyala" onclick="linkKopyala()">&#128279; Link</button>
</div>
<a href="tablo.html" class="tablo-link">Tabloyu Gor &rarr;</a>
</div>
<div class="qr-box" id="qrBox"><div class="lbl">Arkadaslarina gonder:</div><img id="qrImg" alt="QR"><div style="font-size:10px;opacity:.6;margin-top:5px;word-break:break-all" id="qrUrl"></div></div>
</div>
<script src="Rozet.js"></script>
<script src="Ana.js"></script>
</body>
</html>
