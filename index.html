<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#1e3c72,#2a5298,#6a3093);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#fff;transition:background .4s,color .4s}

<body>

</div>
