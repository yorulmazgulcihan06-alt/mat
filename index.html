<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renk Carki</title>
<link rel="stylesheet" href="Style.css">
</head>
<body>
<div class="card">
<button class="temaBtn" id="temaBtn" onclick="temaDegistir()">&#127769;</button>
<h1>Renk Carki</h1>
<p class="sub">Oyna ve yildiz ver!</p>
<div class="wheel-area">
<div class="needle"></div>
<canvas id="cark" width="300" height="300"></canvas>
<div class="center-dot"></div>
<div class="flash" id="flash"></div>
</div>
<button class="btn" id="cevirBtn" onclick="tekCevir()">TEK CEVIR</button>
<button class="btn btn-green" id="otoBtn" onclick="otomatikCevir()">OTOMATIK</button>
<div class="info" id="hizYazi">Hazir</div>
<div class="stats">
<div class="stat" id="st0" style="border-color:#2196F3"><div class="dot" style="background:#2196F3"></div><span class="name">Mavi</span><span class="num" id="s0">0</span></div>
<div class="stat" id="st1" style="border-color:#4CAF50"><div class="dot" style="background:#4CAF50"></div><span class="name">Yesil</span><span class="num" id="s1">0</span></div>
<div class="stat" id="st2" style="border-color:#F44336"><div class="dot" style="background:#F44336"></div><span class="name">Kirmizi</span><span class="num" id="s2">0</span></div>
<div class="stat" id="st3" style="border-color:#666"><div class="dot" style="background:#222"></div><span class="name">Siyah</span><span class="num" id="s3">0</span></div>
</div>
<div class="info">Toplam: <b id="deneme">0</b></div>
<div class="result hidden" id="sonucPanel">
<h2>Tum Puanlar Esitlendi!</h2>
<span class="big-num" id="sonucDeneme">0</span>
<div class="lbl">Yildizini sec:</div>
<div class="star-picker" id="yildizSecici">
<span data-y="1">&#9733;</span><span data-y="2">&#9733;</span><span data-y="3">&#9733;</span><span data-y="4">&#9733;</span><span data-y="5">&#9733;</span>
</div>
<div class="lbl" id="yildizYazi">Yildiz secilmedi</div>
<textarea id="yorumInput" placeholder="Yorum (istege bagli)" maxlength="100"></textarea>
<input type="text" id="isimInput" placeholder="Adin ne?" maxlength="15">
<button class="send-btn" id="gonderBtn" onclick="gonder()" disabled>GONDER</button>
<div class="msg hidden" id="bildirim"></div>
<a href="tablo.html" class="tablo-link">Tabloyu Gor &rarr;</a>
</div>
<div class="qr-box" id="qrBox">
<div class="lbl">Arkadaslarina gonder:</div>
<img id="qrImg" alt="QR">
<div class="qr-url" id="qrUrl"></div>
</div>
</div>
<script src="Script.js"></script>
</body>
</html>
