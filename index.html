<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum Günün Kutlu Olsun Efe!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            text-align: center;
        }

        .container {
            padding: 30px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 400px;
        }

        /* Atan Kalp Animasyonu */
        .heart {
            font-size: 100px;
            color: #ff477e;
            animation: beat 1.2s infinite alternate;
            transform-origin: center;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes beat {
            to { transform: scale(1.15); }
        }

        h1 {
            font-size: 2.5rem;
            color: #ff477e;
            margin: 10px 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #6c757d;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️</div>
        
        <h1>Doğum Günün Kutlu Olsun Efe!</h1>
        
        <p>Olurda görüşemeyiz diye şimdiden önlem aldım 🥹🥹🥹</p>
    </div>

</body>
</html>
