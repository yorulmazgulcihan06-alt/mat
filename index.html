<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renk Çarkı — Otomatik Çevir!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }

  body {
    min-height:100vh;
    background: linear-gradient(135deg,#1e3c72,#2a5298,#6a3093);
    background-size:400% 400%;
    animation: bg 15s ease infinite;
    display:flex; justify-content:center; align-items:center;
    padding:20px; color:#fff;
  }
  @keyframes bg {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .kart {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 520px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  h1 { font-size: 21px; margin-bottom: 6px; }
  .alt { font-size: 13px; opacity: 0.75; margin-bottom: 18px; line-height:1.5; }

  /* ==== ÇARK ==== */
  .cark-alani {
    position: relative;
    width: 300px; height: 300px;
    max-width: 100%;
    margin: 0 auto 18px;
  }
  canvas {
    width: 100%; height: auto; display:block;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
  }
  .ibre {
    position:absolute; top:-12px; left:50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 38px solid #ffd700;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
    z-index: 5;
  }
  .merkez {
    position:absolute; top:50%; left:50%;
    width:36px; height:36px;
    background:#fff; border-radius:50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.25), 0 4px 10px rgba(0,0,0,0.5);
    z-index: 4;
  }

  /* ==== BUTONLAR ==== */
  .butonlar {
    display:flex; gap: 10px; justify-content:center;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  button.anaBtn {
    background: linear-gradient(135deg,#ff512f,#dd2476);
    color:#fff; border:none; border-radius:50px;
    padding: 14px 32px; font-size: 16px; font-weight: bold;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, opacity .2s;
    box-shadow: 0 8px 20px rgba(221,36,118,0.5);
    letter-spacing: 0.5px;
  }
  button.otomatikBtn {
    background: linear-gradient(135deg,#00c853,#00bfa5);
    box-shadow: 0 8px 20px rgba(0,200,83,0.5);
  }
  button.durdurBtn {
    background: linear-gradient(135deg,#d32f2f,#b71c1c);
    box-shadow: 0 8px 20px rgba(211,47,47,0.5);
  }
  button.anaBtn:hover:not(:disabled) { transform: translateY(-3px) scale(1.05); }
  button.anaBtn:active:not(:disabled) { transform: scale(0.97); }
  button.anaBtn:disabled { opacity:.45; cursor:not-allowed; }

  /* ==== PUAN KARTLARI ==== */
  .puanlar {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 20px 0 12px;
  }
  .puan {
    background: rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 12px 14px;
    display:flex; align-items:center; gap:10px;
    border-left: 5px solid;
    transition: transform .25s, box-shadow .25s, background .25s;
  }
  .puan.vurgu {
    transform: scale(1.07);
    background: rgba(255,255,255,0.22);
    box-shadow: 0 0 20px rgba(255,215,0,0.7);
  }
  .renk-nokta {
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
  }
  .puan .isim { font-size: 13px; opacity:0.9; }
  .puan .sayi { margin-left:auto; font-size: 22px; font-weight: bold; }

  .istatistik {
    margin-top: 10px; font-size: 14px; opacity: 0.9;
  }
  .istatistik b { color: #ffd700; font-size: 18px; }

  .mesaj {
    margin-top: 18px; padding: 18px;
    background: linear-gradient(135deg, rgba(76,175,80,0.28), rgba(33,150,243,0.28));
    border: 2px solid rgba(255,215,0,0.6);
    border-radius: 16px;
    font-size: 14px; line-height: 1.7;
    animation: zipla .6s ease;
  }
  .mesaj .buyuk {
    font-size: 34px; font-weight: bold; color:#ffd700;
    display:block; margin: 8px 0;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
  }
  @keyframes zipla {
    0% { transform: scale(0.7); opacity:0; }
    100% { transform: scale(1); opacity:1; }
  }
  .gizli { display:none !important; }

  .kucukBtn {
    background: rgba(255,255,255,0.2);
    color:#fff; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50px;
    padding: 10px 26px; font-size: 14px; font-weight: bold;
    cursor: pointer; margin-top: 8px;
    transition: background .2s, transform .2s;
  }
  .kucukBtn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }

  .kucukBtn.yildizBtn {
    background: linear-gradient(135deg,#ffd700,#ff8c00);
    color: #333;
    border: none;
    box-shadow: 0 6px 16px rgba(255,215,0,0.5);
  }
  .kucukBtn.yildizBtn:hover { background: linear-gradient(135deg,#ffeb3b,#ffa000); }

  .hiz {
    font-size: 12px; opacity: 0.7; margin-top: 10px;
  }

  /* ==================== MODAL ==================== */
  .modalArka {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
    z-index: 100;
    animation: karart 0.35s ease;
  }
  @keyframes karart { from { opacity: 0; } to { opacity: 1; } }

  .modalKart {
    background: linear-gradient(160deg, #ffffff, #f0f4ff);
    color: #333;
    border-radius: 26px;
    padding: 36px 28px 30px;
    max-width: 440px; width: 100%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: modalGiris 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  @keyframes modalGiris {
    0% { transform: scale(0.6) translateY(40px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .kapatBtn {
    position: absolute; top: 14px; right: 14px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #eee;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #666;
    transition: background .2s, transform .2s;
  }
  .kapatBtn:hover { background: #ddd; transform: rotate(90deg); }

  .buyukEmoji {
    font-size: 90px;
    line-height: 1;
    margin-bottom: 10px;
    animation: emojiZipla 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.15));
  }
  @keyframes emojiZipla {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    60% { transform: scale(1.3) rotate(10deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .yildizSatir {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 14px 0 20px;
  }
  .yildiz {
    font-size: 44px;
    color: #ddd;
    transition: color .3s, transform .3s;
    animation: yildizParla 0.5s ease forwards;
  }
  .yildiz.dolu { color: #ffc107; text-shadow: 0 0 16px rgba(255,193,7,0.8); }
  @keyframes yildizParla {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .modalBaslik {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #1e3c72;
  }
  .modalYazi {
    font-size: 16px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .modalDeneme {
    display: inline-block;
    background: linear-gradient(135deg,#6a3093,#2a5298);
    color: #fff;
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .modalIpucu {
    font-size: 12px;
    color: #999;
    margin-top: 14px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="kart">
  <h1>🎡 Renk Çarkı — Otomatik Çevir!</h1>
  <p class="alt">Tek tuşla hızlıca çevir, eşitlenince kendi durur ve kaç denemede olduğunu söyler!</p>

  <div class="cark-alani">
    <div class="ibre"></div>
    <canvas id="cark" width="320" height="320"></canvas>
    <div class="merkez"></div>
  </div>

  <div class="butonlar">
    <button class="anaBtn" id="cevirBtn" onclick="cevir()">🎯 TEK ÇEVİR</button>
    <button class="anaBtn otomatikBtn" id="otoBtn" onclick="otomatikBaslat()">⚡ OTOMATİK ÇEVİR</button>
    <button class="anaBtn durdurBtn gizli" id="durBtn" onclick="otomatikDurdur()">⏹ DURDUR</button>
  </div>

  <div class="hiz" id="hizYazi">Hız: Normal</div>

  <div class="puanlar">
    <div class="puan" id="p0" style="border-color:#2196F3;">
      <div class="renk-nokta" style="background:#2196F3;"></div>
      <span class="isim">Mavi</span>
      <span class="sayi" id="s0">0</span>
    </div>
    <div class="puan" id="p1" style="border-color:#4CAF50;">
      <div class="renk-nokta" style="background:#4CAF50;"></div>
      <span class="isim">Yeşil</span>
      <span class="sayi" id="s1">0</span>
    </div>
    <div class="puan" id="p2" style="border-color:#F44336;">
      <div class="renk-nokta" style="background:#F44336;"></div>
      <span class="isim">Kırmızı</span>
      <span class="sayi" id="s2">0</span>
    </div>
    <div class="puan" id="p3" style="border-color:#888;">
      <div class="renk-nokta" style="background:#222; border:1px solid #999;"></div>
      <span class="isim">Siyah</span>
      <span class="sayi" id="s3">0</span>
    </div>
  </div>

  <div class="istatistik">Toplam deneme: <b id="deneme">0</b></div>

  <div class="mesaj gizli" id="mesaj"></div>
</div>

<!-- ==================== MODAL (YILDIZ EKRANI) ==================== -->
<div id="modalArka" class="modalArka gizli">
  <div class="modalKart">
    <button class="kapatBtn" onclick="modalKapat()">✕</button>
    <div class="buyukEmoji" id="buyukEmoji">🤩</div>
    <div class="yildizSatir" id="yildizSatir"></div>
    <div class="modalDeneme" id="modalDeneme">0 deneme</div>
    <div class="modalBaslik" id="modalBaslik">Sonuç</div>
    <div class="modalYazi" id="modalYazi">Yazı buraya gelecek</div>
    <div class="modalIpucu" id="modalIpucu">Daha az denemede bitirirsen daha çok yıldız kazanırsın! 🌟</div>
  </div>
</div>

<script>
  // ==================== AYARLAR ====================
  const RENKLER = ['#2196F3', '#4CAF50', '#F44336', '#222222'];
  const ISIMLER = ['Mavi', 'Yeşil', 'Kırmızı', 'Siyah'];

  const puanlar = [0, 0, 0, 0];
  let denemeSayisi = 0;
  let rotation = 0;
  let donuyor = false;
  let bitti = false;
  let otomatikMod = false;
  let otomatikZamanlayici = null;

  const TEK_SURE = 1200;
  const OTO_SURE = 120;

  const canvas = document.getElementById('cark');
  const ctx = canvas.getContext('2d');
  const MERKEZ = 160;
  const YARICAP = 150;

  // ==================== ÇARK ÇİZİMİ ====================
  function carkCiz() {
    for (let i = 0; i < 4; i++) {
      const baslangic = i * Math.PI / 2;
      const bitis = (i + 1) * Math.PI / 2;

      ctx.beginPath();
      ctx.moveTo(MERKEZ, MERKEZ);
      ctx.arc(MERKEZ, MERKEZ, YARICAP, baslangic, bitis);
      ctx.closePath();
      ctx.fillStyle = RENKLER[i];
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 3;
      ctx.stroke();

      const ortaAci = baslangic + Math.PI / 4;
      const tx = MERKEZ + Math.cos(ortaAci) * YARICAP * 0.62;
      const ty = MERKEZ + Math.sin(ortaAci) * YARICAP * 0.62;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 4;
      ctx.fillText(ISIMLER[i], 0, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(MERKEZ, MERKEZ, YARICAP, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 7;
    ctx.stroke();
  }

  function carkDondur(aci) {
    ctx.clearRect(0, 0, 320, 320);
    ctx.save();
    ctx.translate(MERKEZ, MERKEZ);
    ctx.rotate(aci * Math.PI / 180);
    ctx.translate(-MERKEZ, -MERKEZ);
    carkCiz();
    ctx.restore();
  }

  // ==================== ÇEVİRME ====================
  function cevir() {
    if (donuyor || bitti || otomatikMod) return;
    cevirAnimasyon(TEK_SURE, false);
  }

  function cevirAnimasyon(sure, otomatik) {
    donuyor = true;
    if (!otomatik) document.getElementById('cevirBtn').disabled = true;

    const hedefDilim = Math.floor(Math.random() * 4);
    const hedefAci = hedefDilim * 90 + 45;
    const istenenRot = ((270 - hedefAci) % 360 + 360) % 360;
    const mevcutRot = ((rotation % 360) + 360) % 360;
    const fark = ((istenenRot - mevcutRot) % 360 + 360) % 360;

    const turSayisi = otomatik ? 2 : 5;
    const toplamDonme = 360 * turSayisi + fark;
    const baslangicRot = rotation;
    const bitisRot = rotation + toplamDonme;
    const baslangicZaman = performance.now();

    function animasyon(zaman) {
      const gecen = Math.min(zaman - baslangicZaman, sure);
      const t = gecen / sure;
      const ease = 1 - Math.pow(1 - t, 3);
      rotation = baslangicRot + toplamDonme * ease;
      carkDondur(rotation);

      if (t < 1) {
        requestAnimationFrame(animasyon);
      } else {
        rotation = bitisRot;
        carkDondur(rotation);
        donuyor = false;

        puanlar[hedefDilim]++;
        denemeSayisi++;
        guncelle();

        const hepsiEsit = puanlar.every(p => p === puanlar[0]);

        if (hepsiEsit) {
          bitti = true;
          otomatikMod = false;
          temizleButonlar();
          esitlikGoster();
          return;
        }

        if (otomatik && otomatikMod) {
          otomatikZamanlayici = setTimeout(() => cevirAnimasyon(OTO_SURE, true), 20);
        } else if (!otomatik) {
          document.getElementById('cevirBtn').disabled = false;
        }
      }
    }

    requestAnimationFrame(animasyon);
  }

  // ==================== OTOMATİK MOD ====================
  function otomatikBaslat() {
    if (bitti || otomatikMod) return;

    otomatikMod = true;
    document.getElementById('cevirBtn').disabled = true;
    document.getElementById('otoBtn').classList.add('gizli');
    document.getElementById('durBtn').classList.remove('gizli');
    document.getElementById('hizYazi').textContent = '⚡ Hız: TURBO (otomatik)';

    cevirAnimasyon(OTO_SURE, true);
  }

  function otomatikDurdur() {
    otomatikMod = false;
    clearTimeout(otomatikZamanlayici);
    temizleButonlar();
    document.getElementById('hizYazi').textContent = 'Hız: Normal';
  }

  function temizleButonlar() {
    document.getElementById('cevirBtn').disabled = false;
    document.getElementById('otoBtn').classList.remove('gizli');
    document.getElementById('durBtn').classList.add('gizli');
  }

  // ==================== GÜNCELLE ====================
  function guncelle() {
    for (let i = 0; i < 4; i++) {
      document.getElementById('s' + i).textContent = puanlar[i];
    }
    document.getElementById('deneme').textContent = denemeSayisi;
  }

  // ==================== EŞİTLİK MESAJI ====================
  function esitlikGoster() {
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById('p' + i);
      el.classList.add('vurgu');
      setTimeout(() => el.classList.remove('vurgu'), 1500);
    }

    document.getElementById('hizYazi').textContent = '✅ Eşitlendi!';

    const m = document.getElementById('mesaj');
    m.classList.remove('gizli');
    m.innerHTML = `
      🎉 <b>TÜM PUANLAR EŞİTLENDİ!</b>
      <span class="buyuk">${denemeSayisi} deneme</span>
      Mavi: <b>${puanlar[0]}</b> • Yeşil: <b>${puanlar[1]}</b><br>
      Kırmızı: <b>${puanlar[2]}</b> • Siyah: <b>${puanlar[3]}</b>
      <br><br>
      <button class="kucukBtn yildizBtn" onclick="yildizGoster()">⭐ YILDIZ VER</button>
      <button class="kucukBtn" onclick="sifirla()">🔄 Baştan Başla</button>
    `;
  }

  // ==================== YILDIZ HESAPLAMA ====================
  // Kaç denemede bittiğine göre yıldız sayısı
  function yildizHesapla(deneme) {
    if (deneme <= 8)  return 5;  // Süper şans
    if (deneme <= 20) return 4;  // Çok iyi
    if (deneme <= 45) return 3;  // Normal
    if (deneme <= 90) return 2;  // Yavaş
    return 1;                    // Çok yavaş
  }

  // ==================== MODAL GÖSTER ====================
  function yildizGoster() {
    const yildizSayisi = yildizHesapla(denemeSayisi);

    // Yıldız dizisi
    let yildizHTML = '';
    for (let i = 1; i <= 5; i++) {
      const dolu = i <= yildizSayisi ? 'dolu' : '';
      yildizHTML += `<span class="yildiz ${dolu}" style="animation-delay:${i * 0.12}s">★</span>`;
    }
    document.getElementById('yildizSatir').innerHTML = yildizHTML;

    // Yıldız sayısına göre emoji + başlık + yazı
    const tablo = {
      1: { emoji: '😭', baslik: 'Ühühühü...',   yazi: 'Bu ne böyle? Çok uzun sürdü! Bir daha dene bakalım... 😢' },
      2: { emoji: '🥹', baslik: 'Yanii...',     yazi: 'Fena değil ama daha iyisini yapabilirsin! Hadi biraz daha çabuk ol. 🙂' },
      3: { emoji: '😀', baslik: 'Olurr!',       yazi: 'Eh, işte bu! Fena sayılmaz, güzel bir sonuç! 👌' },
      4: { emoji: '😃', baslik: 'Huhuu!',       yazi: 'Vay canına, çok hızlı bitti! Süpersin! 🎉' },
      5: { emoji: '🤩', baslik: 'Çokkk Teşekkürler!', yazi: 'İnanılmaz! Bu kadar çabuk biteceğini hiç düşünmemiştim! Sen bir efsanesin! 🌟👑' }
    };

    const t = tablo[yildizSayisi];
    document.getElementById('buyukEmoji').textContent = t.emoji;
    document.getElementById('modalBaslik').textContent = t.baslik;
    document.getElementById('modalYazi').textContent = t.yazi;
    document.getElementById('modalDeneme').textContent = `${denemeSayisi} denemede eşitlendi`;

    // Modalı aç
    document.getElementById('modalArka').classList.remove('gizli');
  }

  function modalKapat() {
    document.getElementById('modalArka').classList.add('gizli');
  }

  // Arka plana tıklayınca kapat
  document.getElementById('modalArka').addEventListener('click', (e) => {
    if (e.target.id === 'modalArka') modalKapat();
  });

  // ESC ile kapat
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') modalKapat();
  });

  // ==================== SIFIRLA ====================
  function sifirla() {
    otomatikMod = false;
    clearTimeout(otomatikZamanlayici);
    for (let i = 0; i < 4; i++) puanlar[i] = 0;
    denemeSayisi = 0;
    bitti = false;
    donuyor = false;
    rotation = 0;
    guncelle();
    carkDondur(0);
    document.getElementById('mesaj').classList.add('gizli');
    document.getElementById('hizYazi').textContent = 'Hız: Normal';
    temizleButonlar();
    modalKapat();
  }

  // ==================== BAŞLAT ====================
  carkDondur(0);
</script>

</body>
</html>
