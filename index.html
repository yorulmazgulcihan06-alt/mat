<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renk Çarkı — Oyun</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(135deg,#1e3c72,#2a5298,#6a3093);
    background-size:400% 400%; animation: bg 15s ease infinite;
    display:flex; justify-content:center; align-items:center;
    padding:20px; color:#fff;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .kart {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px; padding: 28px 24px;
    max-width: 520px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { font-size: 21px; margin-bottom: 6px; }
  .alt { font-size: 13px; opacity: 0.75; margin-bottom: 18px; }
  .cark-alani { position: relative; width: 300px; height: 300px; max-width: 100%; margin: 0 auto 18px; }
  canvas { width: 100%; height: auto; display:block; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5)); }
  .ibre {
    position:absolute; top:-12px; left:50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 38px solid #ffd700;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); z-index: 5;
  }
  .merkez {
    position:absolute; top:50%; left:50%;
    width:36px; height:36px; background:#fff; border-radius:50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.25), 0 4px 10px rgba(0,0,0,0.5); z-index: 4;
  }
  .simsek {
    position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95), transparent 70%);
    opacity:0; pointer-events:none; z-index: 6;
  }
  .simsek.aktif { animation: simsekAnim 0.25s ease-out; }
  @keyframes simsekAnim {
    0% { opacity:0; transform: scale(0.7); }
    40% { opacity:1; transform: scale(1.15); }
    100% { opacity:0; transform: scale(1.4); }
  }
  .butonlar { display:flex; gap: 10px; justify-content:center; flex-wrap: wrap; margin-bottom: 6px; }
  button.anaBtn {
    background: linear-gradient(135deg,#ff512f,#dd2476);
    color:#fff; border:none; border-radius:50px;
    padding: 14px 32px; font-size: 16px; font-weight: bold;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .15s;
    box-shadow: 0 8px 20px rgba(221,36,118,0.5);
  }
  button.otomatikBtn { background: linear-gradient(135deg,#00c853,#00bfa5); box-shadow: 0 8px 20px rgba(0,200,83,0.5); }
  button.anaBtn:hover:not(:disabled) { transform: translateY(-3px) scale(1.05); }
  button.anaBtn:active:not(:disabled) { transform: scale(0.94); }
  button.anaBtn:disabled { opacity:.45; cursor:not-allowed; }
  .puanlar { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0 12px; }
  .puan {
    background: rgba(255,255,255,0.1); border-radius: 14px; padding: 12px 14px;
    display:flex; align-items:center; gap:10px; border-left: 5px solid;
    transition: transform .2s, background .2s;
  }
  .puan.vurgu { transform: scale(1.08); background: rgba(255,255,255,0.25); }
  .renk-nokta { width:16px; height:16px; border-radius:50%; }
  .puan .isim { font-size: 13px; opacity:0.9; }
  .puan .sayi { margin-left:auto; font-size: 22px; font-weight: bold; }
  .istatistik { margin-top: 10px; font-size: 14px; opacity: 0.9; }
  .istatistik b { color: #ffd700; font-size: 18px; }
  .hiz { font-size: 12px; opacity: 0.7; margin-top: 10px; }
  .gizli { display:none !important; }
  .sonucPanel {
    margin-top: 18px; padding: 22px 18px;
    background: linear-gradient(135deg, rgba(76,175,80,0.28), rgba(33,150,243,0.28));
    border: 2px solid rgba(255,215,0,0.6); border-radius: 18px;
    animation: zipla .4s ease;
  }
  @keyframes zipla { 0% { transform: scale(0.85); opacity:0; } 100% { transform: scale(1); opacity:1; } }
  .sonucPanel h2 { font-size: 20px; margin-bottom: 6px; }
  .denemeBuyuk {
    font-size: 44px; font-weight: bold; color:#ffd700;
    display:block; margin: 6px 0 14px;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
  }
  .yildizSecici { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
  .yildizSecici span {
    font-size: 48px; cursor: pointer;
    color: #555; transition: transform .15s, color .15s, text-shadow .15s;
    user-select: none; line-height: 1;
  }
  .yildizSecici span:hover { transform: scale(1.2); }
  .yildizSecici span.dolu {
    color: #ffd700; text-shadow: 0 0 16px rgba(255,215,0,0.9);
    transform: scale(1.1);
  }
  .yildizEtiket { font-size: 14px; opacity: 0.85; margin-bottom: 8px; }
  .yildizEtiket b { color: #ffd700; }
  .isimInput {
    width: 100%; max-width: 280px;
    padding: 12px 18px; border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff; font-size: 15px;
    text-align: center; margin: 12px auto 0; display: block;
    outline: none; transition: border .2s, background .2s;
  }
  .isimInput::placeholder { color: rgba(255,255,255,0.5); }
  .isimInput:focus { border-color: #ffd700; background: rgba(255,255,255,0.18); }
  .gonderBtn {
    background: linear-gradient(135deg,#ffd700,#ff8c00);
    color: #333; border: none; border-radius: 50px;
    padding: 14px 40px; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 14px;
    box-shadow: 0 6px 18px rgba(255,215,0,0.5);
    transition: transform .15s, box-shadow .15s;
  }
  .gonderBtn:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); }
  .gonderBtn:disabled { opacity: .5; cursor: not-allowed; }
  .tabloLink {
    display: inline-block; margin-top: 14px;
    color: #fff; font-size: 13px;
    text-decoration: underline; opacity: 0.85;
  }
  .tabloLink:hover { opacity: 1; }
  .bildirim { margin-top: 12px; font-size: 14px; padding: 10px; border-radius: 12px; }
  .bildirim.iyi { background: rgba(76,175,80,0.35); }
  .bildirim.kotu { background: rgba(244,67,54,0.35); }
</style>
</head>
<body>

<div class="kart">
  <h1>🎡 Renk Çarkı — Oyun</h1>
  <p class="alt">Oyna, sonra kendi yıldızını ver! ⭐</p>

  <div class="cark-alani">
    <div class="ibre"></div>
    <canvas id="cark" width="320" height="320"></canvas>
    <div class="merkez"></div>
    <div class="simsek" id="simsek"></div>
  </div>

  <div class="butonlar">
    <button class="anaBtn" id="cevirBtn" onclick="tekCevir()">🎯 TEK ÇEVİR</button>
    <button class="anaBtn otomatikBtn" id="otoBtn" onclick="otomatikCevir()">⚡ OTOMATİK ÇEVİR</button>
  </div>

  <div class="hiz" id="hizYazi">Hazır ⚡</div>

  <div class="puanlar">
    <div class="puan" id="p0" style="border-color:#2196F3;">
      <div class="renk-nokta" style="background:#2196F3;"></div>
      <span class="isim">Mavi</span><span class="sayi" id="s0">0</span>
    </div>
    <div class="puan" id="p1" style="border-color:#4CAF50;">
      <div class="renk-nokta" style="background:#4CAF50;"></div>
      <span class="isim">Yeşil</span><span class="sayi" id="s1">0</span>
    </div>
    <div class="puan" id="p2" style="border-color:#F44336;">
      <div class="renk-nokta" style="background:#F44336;"></div>
      <span class="isim">Kırmızı</span><span class="sayi" id="s2">0</span>
    </div>
    <div class="puan" id="p3" style="border-color:#888;">
      <div class="renk-nokta" style="background:#222; border:1px solid #999;"></div>
      <span class="isim">Siyah</span><span class="sayi" id="s3">0</span>
    </div>
  </div>

  <div class="istatistik">Toplam deneme: <b id="deneme">0</b></div>

  <div class="sonucPanel gizli" id="sonucPanel">
    <h2>🎉 Tüm Puanlar Eşitlendi!</h2>
    <span class="denemeBuyuk" id="sonucDeneme">0</span>
    <div class="yildizEtiket">Şimdi <b>kendi yıldızını</b> seç:</div>
    <div class="yildizSecici" id="yildizSecici">
      <span data-y="1">★</span>
      <span data-y="2">★</span>
      <span data-y="3">★</span>
      <span data-y="4">★</span>
      <span data-y="5">★</span>
    </div>
    <div class="yildizEtiket" id="yildizYazi">Yıldız seçilmedi</div>
    <input type="text" class="isimInput" id="isimInput" placeholder="Adın ne? (max 15)" maxlength="15">
    <button class="gonderBtn" id="gonderBtn" onclick="gonder()" disabled>📤 GÖNDER</button>
    <div class="bildirim gizli" id="bildirim"></div>
    <a href="tablo.html" class="tabloLink">📊 Tabloyu Gör →</a>
  </div>
</div>

<script>
  const GITHUB_USERNAME = "yorulmazgulcihan06-alt";
  const GITHUB_REPO     = "mat";
  const GITHUB_TOKEN    = "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";

  const RENKLER = ['#2196F3', '#4CAF50', '#F44336', '#222222'];
  const ISIMLER = ['Mavi', 'Yeşil', 'Kırmızı', 'Siyah'];
  const puanlar = [0, 0, 0, 0];
  let denemeSayisi = 0, rotation = 0, bitti = false, secilenYildiz = 0;

  const canvas = document.getElementById('cark');
  const ctx = canvas.getContext('2d');
  const MERKEZ = 160, YARICAP = 150;

  function carkCiz() {
    for (let i = 0; i < 4; i++) {
      const bas = i * Math.PI / 2, bit = (i + 1) * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(MERKEZ, MERKEZ);
      ctx.arc(MERKEZ, MERKEZ, YARICAP, bas, bit); ctx.closePath();
      ctx.fillStyle = RENKLER[i]; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.stroke();
      const oa = bas + Math.PI / 4;
      const tx = MERKEZ + Math.cos(oa) * YARICAP * 0.62;
      const ty = MERKEZ + Math.sin(oa) * YARICAP * 0.62;
      ctx.save(); ctx.translate(tx, ty);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
      ctx.fillText(ISIMLER[i], 0, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(MERKEZ, MERKEZ, YARICAP, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 7; ctx.stroke();
  }

  function carkDondur(a) {
    ctx.clearRect(0, 0, 320, 320);
    ctx.save(); ctx.translate(MERKEZ, MERKEZ); ctx.rotate(a * Math.PI / 180); ctx.translate(-MERKEZ, -MERKEZ);
    carkCiz(); ctx.restore();
  }

  function carkaDilimGoster(d) {
    const ha = d * 90 + 45;
    const ir = ((270 - ha) % 360 + 360) % 360;
    const mr = ((rotation % 360) + 360) % 360;
    const f = ((ir - mr) % 360 + 360) % 360;
    rotation += 360 + f; carkDondur(rotation);
  }

  function simsekCak() {
    const s = document.getElementById('simsek');
    s.classList.remove('aktif'); void s.offsetWidth; s.classList.add('aktif');
  }

  function vurgula(i) {
    const el = document.getElementById('p' + i);
    el.classList.add('vurgu'); setTimeout(() => el.classList.remove('vurgu'), 700);
  }

  function guncelle() {
    for (let i = 0; i < 4; i++) document.getElementById('s' + i).textContent = puanlar[i];
    document.getElementById('deneme').textContent = denemeSayisi;
  }

  function hepsiEsitMi() {
    return puanlar[0] === puanlar[1] && puanlar[1] === puanlar[2] && puanlar[2] === puanlar[3];
  }

  function tekCevir() {
    if (bitti) return;
    simsekCak();
    const h = Math.floor(Math.random() * 4);
    puanlar[h]++; denemeSayisi++;
    guncelle(); carkaDilimGoster(h); vurgula(h);
    if (hepsiEsitMi()) bitir();
  }

  function otomatikCevir() {
    if (bitti) return;
    document.getElementById('cevirBtn').disabled = true;
    document.getElementById('otoBtn').disabled = true;
    document.getElementById('hizYazi').textContent = '⚡ Hesaplanıyor...';

    let guv = 0;
    while (true) {
      guv++;
      let sec;
      if (guv < 500000) {
        const eb = Math.max(...puanlar);
        const w = [eb - puanlar[0] + 1, eb - puanlar[1] + 1, eb - puanlar[2] + 1, eb - puanlar[3] + 1];
        const top = w[0] + w[1] + w[2] + w[3];
        let r = Math.random() * top;
        if ((r -= w[0]) <= 0) sec = 0;
        else if ((r -= w[1]) <= 0) sec = 1;
        else if ((r -= w[2]) <= 0) sec = 2;
        else sec = 3;
      } else {
        const ek = Math.min(...puanlar);
        const a = []; for (let i = 0; i < 4; i++) if (puanlar[i] === ek) a.push(i);
        sec = a[Math.floor(Math.random() * a.length)];
      }
      puanlar[sec]++; denemeSayisi++;
      if (hepsiEsitMi()) break;
    }

    simsekCak(); guncelle();
    const son = Math.floor(Math.random() * 4);
    carkaDilimGoster(son);
    for (let i = 0; i < 4; i++) vurgula(i);
    bitir();
  }

  function bitir() {
    bitti = true;
    document.getElementById('hizYazi').textContent = '✅ Bitti! Şimdi yıldızını seç 👇';
    document.getElementById('sonucDeneme').textContent = denemeSayisi + ' deneme';
    document.getElementById('sonucPanel').classList.remove('gizli');
    document.getElementById('sonucPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  const yildizYaziTablo = {
    1: "😭 Ühühühü...",
    2: "🥹 Yanii...",
    3: "😀 Olurr!",
    4: "😃 Huhuu!",
    5: "🤩 Çokkk Teşekkürler!"
  };

  document.querySelectorAll('#yildizSecici span').forEach(el => {
    el.addEventListener('click', () => {
      secilenYildiz = parseInt(el.dataset.y);
      document.querySelectorAll('#yildizSecici span').forEach((s, i) => {
        s.classList.toggle('dolu', i < secilenYildiz);
      });
      document.getElementById('yildizYazi').innerHTML =
        `<b>${secilenYildiz} yıldız</b> — ${yildizYaziTablo[secilenYildiz]}`;
      kontrolGonder();
    });
  });

  document.getElementById('isimInput').addEventListener('input', kontrolGonder);

  function kontrolGonder() {
    const ad = document.getElementById('isimInput').value.trim();
    document.getElementById('gonderBtn').disabled = !(secilenYildiz > 0 && ad.length > 0);
  }

  async function gonder() {
    const ad = document.getElementById('isimInput').value.trim();
    if (!ad || !secilenYildiz) return;
    const btn = document.getElementById('gonderBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Gönderiliyor...';
    const bildirim = document.getElementById('bildirim');
    bildirim.classList.add('gizli');
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues`, {
        method: 'POST',
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          title: ad,
          body: JSON.stringify({
            yildiz: secilenYildiz,
            deneme: denemeSayisi,
            tarih: new Date().toISOString()
          })
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      bildirim.className = 'bildirim iyi';
      bildirim.innerHTML = '✅ Gönderildi! Tabloya yönlendiriliyorsun...';
      bildirim.classList.remove('gizli');
      setTimeout(() => { window.location.href = 'tablo.html'; }, 1200);
    } catch (err) {
      console.error(err);
      bildirim.className = 'bildirim kotu';
      bildirim.innerHTML = '❌ Gönderilemedi! Token veya interneti kontrol et.';
      bildirim.classList.remove('gizli');
      btn.disabled = false;
      btn.textContent = '📤 GÖNDER';
    }
  }

  carkDondur(0);
</script>

</body>
</html>
