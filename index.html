<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
  body { margin: 0; padding: 20px; background: #1e3c72; color: #fff; font-family: sans-serif; text-align: center; min-height: 100vh; }
  h1 { font-size: 24px; }
  button { padding: 15px 30px; font-size: 18px; margin: 10px; border: none; border-radius: 50px; background: #ff512f; color: #fff; cursor: pointer; }
  .yesil { background: #00c853; }
  #durum { margin-top: 20px; font-size: 14px; opacity: 0.8; }
  #sayi { font-size: 60px; color: #ffd700; margin: 20px; font-weight: bold; }
</style>
</head>
<body>

<h1>Test Sayfasi</h1>
<button onclick="tiklama()">BUTONA BAS</button>
<button class="yesil" onclick="renkDegistir()">TEMA DEGISTIR</button>
<div id="sayi">0</div>
<div id="durum">JS calisiyor</div>

<script>
var sayac = 0;
function tiklama() {
  sayac = sayac + 1;
  document.getElementById("sayi").textContent = sayac;
  document.getElementById("durum").textContent = "Butona " + sayac + " kez bastin";
}
function renkDegistir() {
  if (document.body.style.background === "white") {
    document.body.style.background = "#1e3c72";
    document.body.style.color = "white";
  } else {
    document.body.style.background = "white";
    document.body.style.color = "black";
  }
}
</script>

</body>
</html>
